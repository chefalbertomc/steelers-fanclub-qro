<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generador QR — Steelers Fan Club Querétaro</title>
  <link rel="icon" href="assets/logo.png"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="header-bar" style="justify-content:space-between; padding: 8px 16px; align-items:center;">
  <img src="assets/logo.png" style="height:44px; object-fit:contain; flex-shrink:0;" alt="Steelers Official"/>
  <div style="flex-grow:1; text-align:center; padding:0 8px;">
    <h2 style="margin:0; font-family:var(--font-display); font-size:clamp(10px, 2.8vw, 18px); color:var(--steelers-yellow); letter-spacing:1px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">STEELERS NATION QUERÉTARO <span style="color:#fff;">FAN CLUB</span></h2>
  </div>
  <img src="assets/bww-buffalo.png" style="height:44px; object-fit:contain; flex-shrink:0;" alt="Buffalo Wild Wings"/>
</div>

<div class="container wide">

  <!-- LOGIN STAFF -->
  <div id="sectionLogin">
    <div style="text-align:center; padding:24px 0 16px; max-width:400px; margin:0 auto;">
      <div style="font-size:48px; margin-bottom:12px;">📲</div>
      <h1 style="font-family:var(--font-display); font-size:28px; color:var(--gold);">GENERADOR QR STAFF</h1>
      <p class="text-muted" style="margin-top:8px; font-size:14px;">Acceso exclusivo para el restaurante o staff.</p>
    </div>
    <div class="card" style="max-width:400px; margin:0 auto;">
      <div class="form-group">
        <label for="loginEmail">Email de Administrador</label>
        <input type="email" id="loginEmail" placeholder="admin@steelersqro.com"/>
      </div>
      <div class="form-group">
        <label for="loginPw">Contraseña</label>
        <input type="password" id="loginPw" placeholder="••••••••"/>
      </div>
      <div id="loginStatus" class="status-msg"></div>
      <button class="btn btn-gold mt-4" id="btnLogin">Entrar →</button>
    </div>
  </div>

  <!-- PANEL GENERADOR -->
  <div id="sectionGenerador" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <span class="badge badge-success">● STAFF ACTIVO</span>
      <button class="btn btn-outline btn-sm" id="btnLogout" style="width:auto;">Salir</button>
    </div>
    
    <div style="display:flex; flex-direction:column; md:flex-row; gap:20px;">
      <!-- Columna Izquierda: Botones de Evento -->
      <div class="card" style="flex:1; max-height: 80vh; overflow-y:auto;">
        <h2 style="font-size:18px; color:var(--gold); margin-bottom:12px;">Seleccionar Evento</h2>
        
        <button class="btn btn-outline" style="width:100%; justify-content:flex-start; margin-bottom:16px; font-weight:bold;" onclick="generarQR('VISITA_NORMAL', 'Visita Regular (Restaurante)')">🍔 Visita Normal (Restaurante)</button>
        
        <h3 style="font-size:14px; color:#888; margin-bottom:8px;">Pretemporada</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;">
          <button class="btn btn-outline btn-sm" onclick="generarQR('PRE_SEM1', 'Pretemporada Sem 1: Packers')">Sem 1: Packers</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('PRE_SEM2', 'Pretemporada Sem 2: Jets')">Sem 2: Jets</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('PRE_SEM3', 'Pretemporada Sem 3: Bills')">Sem 3: Bills</button>
        </div>
        
        <h3 style="font-size:14px; color:#888; margin-bottom:8px;">Temporada Regular 2026</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM1', 'Sem 1: Falcons')">Sem 1: Falcons</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM2', 'Sem 2: Patriots')">Sem 2: Patriots</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM3', 'Sem 3: Bengals')">Sem 3: Bengals</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM4', 'Sem 4: Browns')">Sem 4: Browns</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM5', 'Sem 5: Colts')">Sem 5: Colts</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM6', 'Sem 6: Buccaneers')">Sem 6: Buccaneers</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM7', 'Sem 7: Saints')">Sem 7: Saints</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM8', 'Sem 8: Browns')">Sem 8: Browns</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM9', 'Sem 9: BYE WEEK')" disabled style="opacity: 0.5;">Sem 9: BYE WEEK</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM10', 'Sem 10: Bengals')">Sem 10: Bengals</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM11', 'Sem 11: Eagles')">Sem 11: Eagles</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM12', 'Sem 12: Broncos')">Sem 12: Broncos</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM13', 'Sem 13: Texans')">Sem 13: Texans</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM14', 'Sem 14: Jaguars')">Sem 14: Jaguars</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM15', 'Sem 15: Ravens')">Sem 15: Ravens</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM16', 'Sem 16: Panthers')">Sem 16: Panthers</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM17', 'Sem 17: Titans')">Sem 17: Titans</button>
          <button class="btn btn-outline btn-sm" onclick="generarQR('SEM18', 'Sem 18: Ravens')">Sem 18: Ravens</button>
        </div>
      </div>
      
      <!-- Columna Derecha: Vista del QR -->
      <div class="card" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px;">
        <div id="qrHeader" style="margin-bottom:24px;">
          <h2 style="font-size:20px; color:#fff;" id="qrTitle">Selecciona un evento</h2>
          <p class="text-muted" id="qrSubtitle">El código QR aparecerá aquí abajo.</p>
        </div>
        <div id="qrBox" style="background:#fff; padding:20px; border-radius:12px; display:inline-block; border:4px solid var(--gold); display:none;"></div>
      </div>
    </div>

  </div>

</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
// ============================================================
//  GENERADOR QR — Staff 
// ============================================================

// ---- LOGIN ----
document.getElementById('btnLogin').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pw    = document.getElementById('loginPw').value;
  const btn   = document.getElementById('btnLogin');
  const st    = document.getElementById('loginStatus');

  if (!email || !pw) { showStatus(st, 'Completa email y contraseña.', 'error'); return; }
  btn.disabled = true; btn.textContent = '⏳ Entrando...';

  try {
    await auth.signInWithEmailAndPassword(email, pw);
  } catch(e) {
    showStatus(st, '❌ Email o contraseña incorrectos.', 'error');
    btn.disabled = false; btn.textContent = 'Entrar →';
  }
});

// ---- AUTH STATE ----
auth.onAuthStateChanged(async user => {
  if (!user) {
    document.getElementById('sectionLogin').classList.remove('hidden');
    document.getElementById('sectionGenerador').classList.add('hidden');
    return;
  }
  
  // Validar admin/organizador
  const snap = await db.collection('fans').doc(user.uid).get();
  if (snap.exists && snap.data().nivel === 'Organizador') {
    document.getElementById('sectionLogin').classList.add('hidden');
    document.getElementById('sectionGenerador').classList.remove('hidden');
  } else {
    auth.signOut();
    alert('No tienes permisos de organizador para usar esta herramienta.');
  }
});

// ---- GENERAR QR ----
function generarQR(eventId, eventName) {
  const qrBox = document.getElementById('qrBox');
  const qrTitle = document.getElementById('qrTitle');
  const qrSubtitle = document.getElementById('qrSubtitle');
  
  qrBox.innerHTML = ''; // Limpiar anterior
  
  // JSON data que escaneará el fan
  const data = {
    t: "STQRO", // Validation token
    id: eventId,
    n: eventName
  };
  
  const jsonStr = JSON.stringify(data);
  
  new QRCode(qrBox, {
    text: jsonStr,
    width: 300,
    height: 300,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
  
  qrTitle.textContent = eventName;
  qrTitle.style.color = 'var(--gold)';
  qrSubtitle.textContent = '¡Fans! Abran su credencial y presionen "Escanear Asistencia"';
  qrBox.style.display = 'inline-block';
}

// ---- LOGOUT ----
document.getElementById('btnLogout').addEventListener('click', () => {
  auth.signOut();
});

function showStatus(el, msg, type) {
  el.textContent = msg;
  el.className = 'status-msg ' + type;
}
</script>
</body>
</html>
