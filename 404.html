<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Redireccionando... — Steelers Fan Club Querétaro</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #FFB612;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }
    .spinner {
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top: 4px solid #FFB612;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    (function() {
      var path = window.location.pathname.toLowerCase();
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      if (path.indexOf('credencial') !== -1) {
        window.location.replace('./credencial.html' + search + hash);
        return;
      }
      if (path.indexOf('partidos') !== -1) {
        window.location.replace('./partidos.html' + search + hash);
        return;
      }
      if (path.indexOf('admin') !== -1) {
        window.location.replace('./admin.html' + search + hash);
        return;
      }
      if (path.indexOf('scanner') !== -1) {
        window.location.replace('./scanner.html' + search + hash);
        return;
      }
      if (path.indexOf('avisos') !== -1) {
        window.location.replace('./avisos.html' + search + hash);
        return;
      }
      if (path.indexOf('promos') !== -1) {
        window.location.replace('./promos.html' + search + hash);
        return;
      }
      window.location.replace('./index.html' + search + hash);
    })();
  </script>
</head>
<body>
  <h2>🏈 STEELERS NATION QUERÉTARO</h2>
  <div class="spinner"></div>
  <p style="color:#f0f0f0;">Cargando enlace...</p>
  <p style="font-size:13px; margin-top:20px;">
    <a href="credencial.html" style="color:#FFB612; text-decoration:underline;">Toca aquí si no abre automáticamente</a>
  </p>
</body>
</html>
